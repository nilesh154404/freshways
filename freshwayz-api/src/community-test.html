<!DOCTYPE html>
<html>
<head>
    <title>Community Chat Test</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }
        #messages {
            border: 1px solid #000;
            height: 350px;
            overflow-y: scroll;
            padding: 10px;
            background: #fafafa;
        }
        input, button {
            padding: 10px;
            margin: 5px 2px;
        }
    </style>
</head>
<body>

<h2>Community Chat Testing UI</h2>

<label>Backend Server URL:</label><br>
<input id="server" value="http://freshwayz.dexpertsystems.com" style="width:300px">

<br><br>

<label>Community ID:</label><br>
<input id="communityId" type="number" value="1">

<br><br>

<label>Customer ID:</label><br>
<input id="customerId" type="number" value="1">

<br><br>

<button onclick="joinCommunity()">Join Community</button>

<hr>

<h3>Chat History:</h3>
<div id="messages"></div>

<br>

<input id="msgInput" placeholder="Type message..." style="width:300px">
<button onclick="sendMessage()">Send Message</button>

<br><br>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

let socket;

function joinCommunity() {

    let srv = document.getElementById("server").value;
    let comId = document.getElementById("communityId").value;
    let cusId = document.getElementById("customerId").value;

    // 1️⃣ Send HTTP to backend to JOIN community
    fetch(`${srv}/community-message/${comId}/join`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ customerId: Number(cusId) })
    })
    .then(res => res.json())
    .then(data => {

        alert("Joined Community!");

        // 2️⃣ Connect socket after join
        socket = io(srv);

        // 3️⃣ Join websocket room
        socket.emit("joinCommunity", Number(comId));

        // 4️⃣ Load chat history
        loadChats();

        // 5️⃣ Listen new messages
        socket.on("newMessage", msg => {
            appendMessage(msg.sender.fullName, msg.message);
        });

    });
}

function loadChats() {
    let srv = document.getElementById("server").value;
    let comId = document.getElementById("communityId").value;

    fetch(`${srv}/community-message/${comId}/chats`)
        .then(res => res.json())
        .then(list => {

            document.getElementById("messages").innerHTML = "";

            list.forEach(m => {
                appendMessage(m.sender.fullName, m.message);
            });

        });
}

function sendMessage() {

    let comId = Number(document.getElementById("communityId").value);
    let cusId = Number(document.getElementById("customerId").value);
    let text = document.getElementById("msgInput").value;

    if (!text.trim()) return;

    socket.emit("sendMessage", {
        communityId: comId,
        customerId: cusId,
        message: text
    });

    document.getElementById("msgInput").value = "";
}

function appendMessage(name, message) {

    let box = document.getElementById("messages");
    box.innerHTML += `<div><b>${name}</b>: ${message}</div>`;
    box.scrollTop = box.scrollHeight;

}

</script>

</body>
</html>
